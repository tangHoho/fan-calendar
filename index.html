<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="">
<title>追星行事曆</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7EEF6; --card:#FFFFFF; --ink:#2E1A47; --ink-soft:#6E5A86; --line:#E4D3E6;
  --pop:#E0217A; --pop-ink:#FFFFFF; --mint:#1FA38A; --butter:#FFD84D; --shade:rgba(46,26,71,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1428; --card:#2A1F3A; --ink:#F4E9F7; --ink-soft:#B8A5CC; --line:#403352;
    --pop:#FF4F9D; --pop-ink:#1C1428; --mint:#4FD6BC; --butter:#FFD84D; --shade:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#1C1428; --card:#2A1F3A; --ink:#F4E9F7; --ink-soft:#B8A5CC; --line:#403352;
  --pop:#FF4F9D; --pop-ink:#1C1428; --mint:#4FD6BC; --butter:#FFD84D; --shade:rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
h1{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:clamp(28px,7vw,40px);line-height:1.1;margin:0;letter-spacing:.02em}
.me-btn{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700;font-size:14px}
.me-btn .av{width:32px;height:32px;font-size:18px}

/* month nav */
.month{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.month h2{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:22px;margin:0}
.nav{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:18px;display:grid;place-items:center}
.text-btn{border:none;background:none;color:var(--ink-soft);font-size:14px;text-decoration:underline;padding:8px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:8px}
.dow{text-align:center;font-size:12px;color:var(--ink-soft);padding:2px 0 6px;font-weight:700}
.day{border:none;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;padding:4px 2px 5px;font-size:14px;position:relative;min-height:70px;min-width:0;text-align:center}
.day .n{align-self:center;min-width:24px;line-height:22px}
.day.has{background:color-mix(in srgb,var(--pop) 9%,transparent)}
.day.out{color:var(--ink-soft);opacity:.35}
.day.today .n{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 7px}
.day.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
.day:hover:not(.sel):not(.has){background:var(--paper)}
.pill{display:block;font-size:10.5px;line-height:1.4;font-weight:700;padding:1px 3px;border-radius:5px;background:var(--pop);color:var(--pop-ink);white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:left;letter-spacing:-.02em}
@media (min-width:600px){.pill{text-overflow:ellipsis;padding:1px 5px}}
.pill.mine{background:var(--mint);color:#fff}
.pill.sale{background:var(--butter);color:#2E1A47}
.more{font-size:11px;font-weight:700;color:var(--ink-soft);line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-soft);margin-top:8px;padding-left:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
@media (min-width:600px){.day{min-height:88px}.pill{font-size:12px}}
.sale-line{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;background:var(--butter);color:#2E1A47;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700}
.sale-line a{color:#2E1A47}
.ticket.salerow{grid-template-columns:88px 1fr}
.ticket.salerow .stub{background:var(--butter);color:#2E1A47}
.ticket.salerow .body{padding-top:12px;padding-bottom:12px}
.salerow .kicker{font-size:13px;font-weight:700;color:var(--ink-soft)}
.tp{display:flex;align-items:center;gap:6px}
.tp select{flex:1;min-width:0}
.tp b{font-weight:900}
fieldset.sale{border:2px dashed var(--line);border-radius:14px;padding:4px 14px 14px;margin:16px 0 0}
fieldset.sale legend{font-weight:900;font-size:14px;padding:0 6px}

/* list */
.list-head{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 10px}
.list-head h3{margin:0;font-size:17px;font-weight:900}
.tickets{display:flex;flex-direction:column;gap:14px}

.ticket{display:grid;grid-template-columns:88px 1fr;background:var(--card);border-radius:16px;box-shadow:0 3px 0 var(--shade);position:relative;overflow:hidden}
.stub{background:var(--pop);color:var(--pop-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px;position:relative;text-align:center}
.ticket.going .stub{background:var(--mint)}
.stub .md{font-family:"Huninn","Noto Sans TC",sans-serif;font-size:26px;line-height:1}
.stub .wd{font-size:13px;margin-top:6px;font-weight:700;opacity:.9}
.stub .tm{font-size:13px;margin-top:2px;opacity:.9}
/* perforation */
.stub::after{content:"";position:absolute;right:-6px;top:0;bottom:0;width:12px;
  background:radial-gradient(circle at 6px 8px,var(--card) 4px,transparent 4.5px) 0 0/12px 16px repeat-y}
.body{padding:14px 16px 14px 20px;min-width:0}
.title-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ev-title{font-weight:900;font-size:17px;line-height:1.35;margin:0;word-break:break-word;background:none;border:none;padding:0;text-align:left}
.edit{flex:none;border:none;background:none;color:var(--ink-soft);font-size:13px;padding:2px 4px;text-decoration:underline}
.meta{font-size:14px;color:var(--ink-soft);margin-top:2px;word-break:break-word}
.artist{display:inline-block;font-size:12px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:0 8px;margin:6px 6px 0 0;color:var(--ink)}
.note{font-size:14px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.crew{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px 2px 2px;font-size:13px;font-weight:700;background:var(--paper)}
.chip .av{width:24px;height:24px;font-size:14px}
.join{margin-left:auto;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
.join.on{background:var(--mint);border-color:var(--mint);color:#fff}
.nobody{font-size:13px;color:var(--ink-soft)}

.av{display:inline-grid;place-items:center;border-radius:50%;flex:none;line-height:1;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.txt{font-family:"Huninn","Noto Sans TC",sans-serif;color:#2E1A47}
.av .t2{font-size:.66em;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:999px}
.tab{flex:1;border:none;background:none;border-radius:999px;padding:8px 0;font-weight:700;font-size:14px;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--shade)}
.panel{margin-top:12px}
.styles{display:flex;flex-wrap:wrap;gap:6px}
.style-chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.style-chip[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.arts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.art{aspect-ratio:1;border-radius:50%;border:3px solid transparent;padding:0;overflow:hidden;display:block}
.art[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
.art img{width:100%;height:100%;display:block}
.hint{font-size:13px;color:var(--ink-soft);margin:8px 0 0}
.credit{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:2px}
.credit a{color:inherit}

.empty{border:2px dashed var(--line);border-radius:16px;padding:28px 16px;text-align:center;color:var(--ink-soft)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));border:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:14px 26px;font-weight:900;font-size:16px;box-shadow:0 6px 18px var(--shade)}

.version{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:4px;opacity:.8}
.status{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:28px}
.banner{background:var(--butter);color:#2E1A47;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px;display:none}
.banner.show{display:block}

/* sheets */
dialog{border:none;padding:0;background:var(--card);color:var(--ink);border-radius:22px;width:min(520px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto}
dialog::backdrop{background:rgba(28,20,40,.55)}
@media (max-width:560px){
  dialog{margin:auto auto 0;width:100%;max-width:100%;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.sheet{padding:20px}
.sheet h2{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:24px;margin:0 0 14px}
.sheet h4{font-size:14px;margin:18px 0 8px;color:var(--ink-soft);font-weight:700}
label.f{display:block;font-size:14px;font-weight:700;margin:12px 0 4px}
.in{width:100%;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:16px}
.in:focus{border-color:var(--ink);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.members{display:flex;flex-wrap:wrap;gap:8px}
.member{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px 3px 3px;font-weight:700;font-size:14px}
.member.cur{border-color:var(--ink)}
.member .av{width:30px;height:30px;font-size:17px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:210px;overflow:auto}
.emo{aspect-ratio:1;border:2px solid transparent;background:var(--paper);border-radius:12px;font-size:22px;display:grid;place-items:center;padding:0}
.emo[aria-pressed="true"]{border-color:var(--ink)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
.preview{display:flex;align-items:center;gap:10px;margin-top:14px}
.preview .av{width:48px;height:48px;font-size:26px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:10px 20px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:#C43B3B;color:#C43B3B;margin-right:auto}
.err{color:#C43B3B;font-size:14px;margin-top:8px;min-height:1em}
@media (prefers-reduced-motion:no-preference){
  .ticket.pulse{animation:pulse .5s ease}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.015)}100%{transform:scale(1)}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>追星行事曆</h1>
    <button class="me-btn" id="meBtn" type="button"><span class="av" id="meAv" style="background:var(--line)">?</span><span id="meName">選擇頭像</span></button>
  </header>
  <div class="banner" id="banner"></div>

  <div class="month">
    <h2 id="monthLabel"></h2>
    <div class="nav">
      <button class="text-btn" id="todayBtn" type="button">今天</button>
      <button class="icon-btn" id="prevBtn" type="button" aria-label="上個月">‹</button>
      <button class="icon-btn" id="nextBtn" type="button" aria-label="下個月">›</button>
    </div>
  </div>
  <div class="grid" id="grid" role="grid"></div>
  <div class="legend" aria-hidden="true"><span><i style="background:var(--pop)"></i>活動</span><span><i style="background:var(--mint)"></i>我要去</span><span><i style="background:var(--butter)"></i>搶票</span></div>

  <div class="list-head">
    <h3 id="listTitle"></h3>
    <button class="text-btn" id="clearSel" type="button" hidden>看整個月</button>
  </div>
  <div class="tickets" id="tickets"></div>
  <p class="status" id="status">載入中…</p>
  <p class="version" id="version"></p>
  <p class="credit">插畫頭像由 <a href="https://www.dicebear.com" target="_blank" rel="noopener">DiceBear</a> 提供</p>
</div>

<button class="fab" id="addBtn" type="button">＋ 新增活動</button>

<!-- identity sheet -->
<dialog id="whoDlg">
  <form class="sheet" method="dialog" id="whoForm">
    <h2>你是誰？</h2>
    <div id="pickWrap">
      <h4>點自己的頭像切換身分</h4>
      <div class="members" id="memberPick"></div>
    </div>
    <h4 id="newHead">建立新頭像</h4>
    <div class="preview"><span class="av" id="pvAv"></span><strong id="pvName">暱稱</strong></div>
    <label class="f" for="nick">暱稱</label>
    <input class="in" id="nick" maxlength="12" placeholder="例如：吼、ZAN" autocomplete="off">
    <h4>頭像樣式</h4>
    <div class="tabs" role="tablist" id="kindTabs"></div>
    <div class="panel" id="kindPanel"></div>
    <div id="colorWrap">
      <h4>底色</h4>
      <div class="colors" id="colorPick"></div>
    </div>
    <input type="file" id="photoFile" accept="image/*" hidden>
    <p class="err" id="whoErr"></p>
    <div class="actions">
      <button class="btn" value="cancel" type="submit" formnovalidate>取消</button>
      <button class="btn" id="createNew" type="button" hidden>另建新頭像</button>
      <button class="btn primary" id="saveMe" type="button">建立並使用</button>
    </div>
  </form>
</dialog>

<!-- event sheet -->
<dialog id="evDlg">
  <form class="sheet" id="evForm">
    <h2 id="evHead">新增活動</h2>
    <label class="f" for="evTitle">活動名稱</label>
    <input class="in" id="evTitle" required maxlength="60" placeholder="例如：Noey's Run club 2">
    <div class="row2">
      <div><label class="f" for="evDate">日期</label><input class="in" id="evDate" type="date" required></div>
      <div><label class="f" for="evTimeH">時間（24 小時制，可空白）</label><div class="tp"><select class="in" id="evTimeH" aria-label="時"></select><b>:</b><select class="in" id="evTimeM" aria-label="分"></select></div></div>
    </div>
    <label class="f" for="evArtist">偶像／團體</label>
    <input class="in" id="evArtist" maxlength="30" placeholder="例如：Noey">
    <label class="f" for="evPlace">地點</label>
    <input class="in" id="evPlace" maxlength="60" placeholder="例如：大佳河濱公園">
    <fieldset class="sale">
      <legend>🎫 搶票（可空白）</legend>
      <div class="row2">
        <div><label class="f" for="evSaleDate">開賣日期</label><input class="in" id="evSaleDate" type="date"></div>
        <div><label class="f" for="evSaleH">開賣時間</label><div class="tp"><select class="in" id="evSaleH" aria-label="時"></select><b>:</b><select class="in" id="evSaleM" aria-label="分"></select></div></div>
      </div>
      <label class="f" for="evSaleUrl">售票網址</label>
      <input class="in" id="evSaleUrl" type="url" maxlength="300" placeholder="https://tixcraft.com/…" inputmode="url">
    </fieldset>
    <label class="f" for="evNote">備註</label>
    <textarea class="in" id="evNote" rows="3" maxlength="400" placeholder="售票時間、集合地點、應援物…"></textarea>
    <p class="err" id="evErr"></p>
    <div class="actions">
      <button class="btn danger" id="evDel" type="button" hidden>刪除活動</button>
      <button class="btn" id="evCancel" type="button">取消</button>
      <button class="btn primary" type="submit" id="evSave">儲存</button>
    </div>
  </form>
</dialog>

<script type="module">
/* ============ 版本 ============ */
const APP_VERSION = "1.2.1";
const APP_UPDATED = "2026-09-24";
/* Firebase 金鑰放在同資料夾的 firebase-config.js，更新 index.html 不會蓋掉它 */
/* ============================== */
let firebaseConfig=null, configError="";
try{
  const mod=await import("./firebase-config.js");
  firebaseConfig=mod.firebaseConfig||mod.default||null;
  if(!firebaseConfig)configError="firebase-config.js 裡找不到 firebaseConfig";
}catch(e){configError="找不到 firebase-config.js"}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const EMOJIS=["🐯","🐰","🐻","🐱","🐶","🦊","🐼","🐨","🐸","🐥","🐧","🦄","🐹","🐷","🐵","🐮","🐳","🐙","🦖","🐝","🦋","🐞","🌸","🌷","🌻","🍀","⭐","🌙","🌈","🔥","💎","🎀","🧸","🍓","🍑","🍒","🍋","🥑","🍩","🧁","🎧","🎤","🎸","💜","💙","💚"];
const ART_STYLES=[["lorelei","少女"],["notionists","手繪"],["open-peeps","塗鴉人"],["thumbs","圓仔"],["pixel-art","像素"],["bottts-neutral","機器人"]];
const KINDS=[["emoji","表情"],["art","插畫"],["text","文字"],["photo","照片"]];
const COLORS=["#FFC2DC","#D9C8FF","#BDEBDD","#FFD9B0","#C4DDFF","#FFEFA8","#FFC4C4","#D6DDE4"];
const WD=["日","一","二","三","四","五","六"];
const $=id=>document.getElementById(id);

$("version").textContent="版本 v"+APP_VERSION+"（"+APP_UPDATED+"）";
document.querySelector('meta[name="app-version"]').content=APP_VERSION;

const LS_ME="fancal.me", LS_LOCAL="fancal.local";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

const S={members:{},events:{},rsvps:{},me:lsGet(LS_ME),cursor:new Date(),sel:null,mode:"loading",readOnly:false,lastJoined:null};
S.cursor.setDate(1);

/* ---------- 資料層 ---------- */
let fs=null;
const local={
  load(){try{const d=JSON.parse(lsGet(LS_LOCAL)||"{}");S.members=d.members||{};S.events=d.events||{};S.rsvps=d.rsvps||{}}catch(e){}},
  save(){lsSet(LS_LOCAL,JSON.stringify({members:S.members,events:S.events,rsvps:S.rsvps}))}
};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function handleErr(e){
  if(e&&e.code==="permission-denied"){showBanner("資料庫拒絕寫入。請確認 Firestore 安全規則已發布、匿名登入已啟用。");return}
  showBanner("沒有存到，請檢查網路後再試一次。");
  throw e;
}
async function put(col,id,data){
  if(S.mode==="cloud"){try{await setDoc(doc(fs,col,id),data)}catch(e){handleErr(e)}}
  else{S[col][id]=data;local.save();render()}
}
async function del(col,id){
  if(S.mode==="cloud"){try{await deleteDoc(doc(fs,col,id))}catch(e){handleErr(e)}}
  else{delete S[col][id];local.save();render()}
}
async function delEventWithRsvps(eid){
  const ids=goingOf(eid).map(m=>rsvpId(eid,m));
  if(S.mode==="cloud"){
    const b=writeBatch(fs);ids.forEach(r=>b.delete(doc(fs,"rsvps",r)));b.delete(doc(fs,"events",eid));
    try{await b.commit()}catch(e){handleErr(e)}
  }else{ids.forEach(r=>delete S.rsvps[r]);delete S.events[eid];local.save();render()}

function subscribe(col){
  onSnapshot(collection(fs,col),snap=>{
    const o={};snap.forEach(d=>{o[d.id]=d.data()});S[col]=o;S.loaded[col]=true;
    if(S.mode==="loading"&&S.loaded.members&&S.loaded.events&&S.loaded.rsvps)S.mode="cloud";
    render();
  },err=>{
    if(err.code==="permission-denied")showBanner("無法讀取資料：請確認 Firestore 安全規則已發布。");
    else setStatus("同步中斷，請重新整理頁面。");
  });
}

function configured(){const c=firebaseConfig;return !!(c&&c.apiKey&&!String(c.apiKey).startsWith("填入")&&c.projectId&&!String(c.projectId).includes("你的"))}

async function boot(){
  render();
  if(!configured()){
    S.mode="local";local.load();
    showBanner((configError?configError+"，":"firebase-config.js 還沒填好，")+"目前是單機模式：資料只存在這台裝置，朋友看不到。");
    setStatus("單機模式");render();return;
  }
  try{
    const app=initializeApp(firebaseConfig);
    fs=getFirestore(app);
    const auth=getAuth(app);
    onAuthStateChanged(auth,u=>{
      if(u&&!S.loaded){S.loaded={};["members","events","rsvps"].forEach(subscribe);setStatus("已連線，朋友新增的活動會即時出現")}
    });
    await signInAnonymously(auth);
  }catch(e){
    S.mode="local";local.load();
    showBanner("連不上 Firebase（"+(e.code||"未知錯誤")+"），目前改用單機模式。請確認已啟用匿名登入。");
    setStatus("單機模式");render();
  }
}

function render(){
  const me=S.members[S.me];
  const av=avatar(me);av.id="meAv";$("meAv").replaceWith(av);
  $("meName").textContent=me?me.name:"選擇頭像";

  const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
  $("monthLabel").textContent=y+" 年 "+(m+1)+" 月";

  const evs=sortedEvents();
  const byDay={},saleByDay={};
  evs.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e);if(e.saleDate)(saleByDay[e.saleDate]=saleByDay[e.saleDate]||[]).push(e)});
  const narrow=matchMedia("(max-width:599px)").matches;

  const g=$("grid");g.textContent="";
  WD.forEach(w=>{const d=document.createElement("div");d.className="dow";d.textContent=w;g.appendChild(d)});
  const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  const today=ymd(new Date());
  const weeks=Math.ceil((first.getDay()+new Date(y,m+1,0).getDate())/7);
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const key=ymd(d);
    const b=document.createElement("button");b.type="button";b.className="day";
    if(d.getMonth()!==m)b.classList.add("out");
    if(key===today)b.classList.add("today");
    if(key===S.sel)b.classList.add("sel");
    const n=document.createElement("span");n.className="n";n.textContent=d.getDate();b.appendChild(n);
    const list=byDay[key]||[],sales=(saleByDay[key]||[]).slice().sort((a,b)=>(a.saleTime||"99").localeCompare(b.saleTime||"99"));
    const pills=[...list.map(e=>({e,sale:false})),...sales.map(e=>({e,sale:true}))];
    if(pills.length)b.classList.add("has");
    const cap=narrow?2:3,showN=pills.length>cap?cap-1:pills.length;
    pills.slice(0,showN).forEach(({e,sale})=>{
      const p=document.createElement("span");
      p.className="pill"+(sale?" sale":(S.me&&S.rsvps[rsvpId(e.id,S.me)]?" mine":""));
      p.textContent=(sale&&!narrow?"🎫":"")+e.title;b.appendChild(p)});
    if(pills.length>showN){const mo=document.createElement("span");mo.className="more";mo.textContent="+"+(pills.length-showN);b.appendChild(mo)}
    const parts=[];if(list.length)parts.push(list.length+" 個活動");if(sales.length)parts.push(sales.length+" 個搶票");
    b.setAttribute("aria-label",(d.getMonth()+1)+"月"+d.getDate()+"日，"+(parts.join("、")||"沒有活動"));
    b.addEventListener("click",()=>{
      if(d.getMonth()!==m)S.cursor=new Date(d.getFullYear(),d.getMonth(),1);
      S.sel=S.sel===key?null:key;render()});
    g.appendChild(b);
  }

  const inView=s=>{if(!s)return false;if(S.sel)return s===S.sel;const d=parseYmd(s);return d.getFullYear()===y&&d.getMonth()===m};
  const shown=[];
  evs.forEach(e=>{if(inView(e.date))shown.push({type:"event",e,key:e.date+" "+(e.time||"99")});
    if(inView(e.saleDate))shown.push({type:"sale",e,key:e.saleDate+" "+(e.saleTime||"99")})});
  shown.sort((a,b)=>a.key.localeCompare(b.key)||(a.type==="sale"?-1:1));
  if(S.sel){const d=parseYmd(S.sel);$("listTitle").textContent=(d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）的活動"}
  else $("listTitle").textContent="這個月的活動";
  $("clearSel").hidden=!S.sel;

  const t=$("tickets");t.textContent="";
  if(S.mode==="loading")return;
  if(!shown.length){
    const e=document.createElement("div");e.className="empty";
    e.textContent=(S.sel?"這天":"這個月")+"還沒有活動或搶票。按下方「新增活動」加一個。";
    t.appendChild(e);return;
  }
  shown.forEach(it=>t.appendChild(it.type==="sale"?saleRow(it.e):ticket(it.e)));

function shrinkPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{
      const n=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement("canvas");c.width=c.height=160;
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,160,160);
      x.drawImage(img,(img.naturalWidth-n)/2,(img.naturalHeight-n)/2,n,n,0,0,160,160);
      URL.revokeObjectURL(url);
      let q=.85,out=c.toDataURL("image/jpeg",q);
      while(out.length>55000&&q>.4){q-=.15;out=c.toDataURL("image/jpeg",q)}
      out.length>55000?rej(new Error("too big")):res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"))};
    img.src=url;
  });
}

  if(Object.entries(S.members).some(([id,m])=>m.name===name&&id!==self)){$("whoErr").textContent="「"+name+"」已經有人用了，上面直接點它，或換個暱稱。";return}
  if(draft.kind==="photo"&&!draft.photo){$("whoErr").textContent="請先選一張照片。";return}
  const data={name,kind:draft.kind,color:draft.color,createdAt:self&&S.members[self].createdAt||Date.now(),updatedAt:Date.now()};
  if(draft.kind==="emoji")data.emoji=draft.emoji;
  if(draft.kind==="art"){data.style=draft.style;data.seed=draft.seed}
  if(draft.kind==="text")data.text=draft.text;

  try{await put("members",id,data);useMe(id)}
  catch(e){$("whoErr").textContent="沒有存到，請再試一次。"}

}
$("evCancel").addEventListener("click",()=>$("evDlg").close());
$("evForm").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const data={title:$("evTitle").value.trim(),date:$("evDate").value,time:getTime("evTimeH","evTimeM"),artist:$("evArtist").value.trim(),place:$("evPlace").value.trim(),note:$("evNote").value.trim(),
    saleDate:$("evSaleDate").value,saleTime:getTime("evSaleH","evSaleM"),saleUrl:$("evSaleUrl").value.trim()};
  if(!data.title||!data.date){$("evErr").textContent="活動名稱和日期都要填。";return}
  if(!data.saleDate&&data.saleTime){$("evErr").textContent="填了開賣時間，也要填開賣日期。";return}
  if(data.saleUrl&&!safeUrl(data.saleUrl)){$("evErr").textContent="售票網址要以 https:// 開頭。";return}
  const id=editing||uid();
  data.createdBy=(editing&&S.events[editing]&&S.events[editing].createdBy)||S.me||"";
  data.updatedAt=Date.now();
  $("evSave").disabled=true;
  try{await put("events",id,data);$("evDlg").close();
    const d=parseYmd(data.date);S.cursor=new Date(d.getFullYear(),d.getMonth(),1);if(S.sel&&S.sel!==data.date)S.sel=null;render()}
  catch(e){$("evErr").textContent="沒有存到，請再試一次。"}
  finally{$("evSave").disabled=false}
});
$("evDel").addEventListener("click",async()=>{
  if(!editing)return;
  const title=S.events[editing]&&S.events[editing].title;
  if(!confirm("刪除「"+title+"」？所有人都會看不到這個活動。"))return;
  try{await delEventWithRsvps(editing);$("evDlg").close()}
  catch(e){$("evErr").textContent="沒有刪除成功，請再試一次。"}
});
$("addBtn").addEventListener("click",()=>openEvent(null));

$("prevBtn").addEventListener("click",()=>{S.cursor=new Date(S.cursor.getFullYear(),S.cursor.getMonth()-1,1);S.sel=null;render()});
$("nextBtn").addEventListener("click",()=>{S.cursor=new Date(S.cursor.getFullYear(),S.cursor.getMonth()+1,1);S.sel=null;render()});
$("todayBtn").addEventListener("click",()=>{const n=new Date();S.cursor=new Date(n.getFullYear(),n.getMonth(),1);S.sel=null;render()});
$("clearSel").addEventListener("click",()=>{S.sel=null;render()});

boot();
</script>

</body>
</html>
